<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarktPilot" />
    <title>MarktPilot</title>
    <script>
      // Theme-Bootstrap: laeuft VOR React, damit der erste Render
      // nicht im hellen Schema aufblitzt, wenn der User Dunkel gewaehlt hat.
      (function () {
        try {
          var pref = localStorage.getItem('markt-pilot:theme');
          var dark =
            pref === 'dark' ||
            ((pref === 'system' || pref === null) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage kann in Private-Mode kaputt sein — egal, Fallback ist Hell. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
